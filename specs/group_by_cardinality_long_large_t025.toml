[setup]
statements = [
  "create table t025 (x long) clustered into 5 shards",
  "insert into t025 (x) (select x % 2500000 from generate_series(1, 10000000) as t (x))",
  "refresh table t025",
  "optimize table t025"
]


[[queries]]
name = "count_distinct_t025"
statement = "select count(distinct x) from t025"
concurrency = 1
iterations = 50
warmup = 3

[teardown]
statements = [
  "drop table if exists t025"
]
