[setup]
statements = [
  "create table t095 (x long)",
  "insert into t095 (x) (select x % 9500000 from generate_series(1, 10000000) as t (x))",
  "refresh table t095",
  "optimize table t095 with (max_num_segments = 1000)",
  "delete from t095 where x % 10 = 0",
  "refresh table t095"
]

[[queries]]
name = "analyze-long-t095-with-deletes"
statement = '''analyze'''
concurrency = 1
warmup = 50
iterations = 300

[teardown]
statements = ["drop table if exists t095"]
