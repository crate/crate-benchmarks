    select count(distinct "destinationURL") from uservisits_1_shard
'''
concurrency = 5
iterations = 150

[[queries]]
name = "count-distinct-sourceIP"
statement = '''
    select count(distinct "sourceIP") from uservisits_1_shard
'''
concurrency = 5
iterations = 150
