# ClickBench distinct-aggregation slow queries, group 2: group by a low
# cardinality column, order by the distinct aggregation.
# Query taken from https://benchmark.clickhouse.com (ClickBench Q9),
# licensed under Creative Commons, see
# https://github.com/ClickHouse/ClickBench/blob/main/LICENSE
#
# See clickbench_distinct_global.toml for notes on the COPY FROM options.

[setup]
statement_files = ["../sql/hits.sql"]
statements = [
    '''
    COPY hits
    FROM 'file:///home/haris/projects/crate/clickhouse-hits-3M.tsv'
    WITH (
        "delimiter" = e'\t',
        "format" = 'csv',
        "header" = false,
        "empty_string_as_null" = false,
        "fail_fast" = true
    )
    ''',
    "refresh table hits"
]

# Q9: one distinct-count state per group, ordered by the distinct count.
# The LIMIT cannot be pushed down, all groups have to be aggregated first.
[[queries]]
name = "CH-Q9-group-by-regionid-order-by-count-distinct"
statement = '''
    SELECT RegionID, COUNT(DISTINCT UserID) AS u
    FROM hits
    GROUP BY RegionID
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 20

