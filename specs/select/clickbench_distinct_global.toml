# ClickBench distinct-aggregation slow queries, group 1: global aggregations.
# Queries taken from https://benchmark.clickhouse.com (ClickBench Q5, Q6),
# licensed under Creative Commons, see
# https://github.com/ClickHouse/ClickBench/blob/main/LICENSE
#
# The COPY FROM below reads a local extract of the ClickBench `hits` dataset.
# Adjust the path to point at your own copy.
#
# NOTE: `empty_string_as_null` must stay `false`. With `true`, empty TEXT
# values become NULL, which violates the `NOT NULL` constraints in
# sql/hits.sql and makes `<> ''` predicates (see
# clickbench_distinct_filtered.toml) match nothing.

[setup]
statement_files = ["../sql/hits.sql"]
statements = [
    '''
    COPY hits
    FROM 'file:///home/haris/projects/crate/clickhouse-hits-3M.tsv'
    WITH (
        "delimiter" = e'\t',
        "format" = 'csv',
        "header" = false,
        "empty_string_as_null" = false,
        "fail_fast" = true
    )
    ''',
    "refresh table hits"
]

# Q5: high cardinality distinct count on a BIGINT column.
[[queries]]
name = "CH-Q5-count-distinct-userid"
statement = '''
    SELECT COUNT(DISTINCT UserID)
    FROM hits
'''
concurrency = 1
iterations = 20

# Q6: high cardinality distinct count on a TEXT column.
[[queries]]
name = "CH-Q6-count-distinct-searchphrase"
statement = '''
    SELECT COUNT(DISTINCT SearchPhrase)
    FROM hits
'''
concurrency = 1
iterations = 20

