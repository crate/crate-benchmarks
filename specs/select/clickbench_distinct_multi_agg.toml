# ClickBench distinct-aggregation slow queries, group 3: several aggregations
# next to the distinct aggregation, grouped by a different column and ordered
# by count(*), with and without a filter.
# Queries taken from https://benchmark.clickhouse.com (ClickBench Q10, Q23),
# licensed under Creative Commons, see
# https://github.com/ClickHouse/ClickBench/blob/main/LICENSE
#
# Restores the `hits` table from the `snapshots_1m` snapshot instead of
# re-importing the .tsv extract with COPY FROM. Much faster, but the table's
# schema, shard count and settings come from the snapshot, not from
# sql/hits.sql -- including the fact that it was loaded with
# `empty_string_as_null = false`, which the `<> ''` predicates of Q11, Q12,
# Q14 and Q23 depend on.
#
# sql/hits_snapshot_repo.sql only registers the repository -- it must not
# create the table, because RESTORE fails with RelationAlreadyExists if one of
# that name is already present. For the same reason a rerun against a
# long-running instance needs the table dropped first; with compare_run.py
# each version gets a fresh node, so nothing to do there.
#
# The repository also holds `hits` (3M rows) and `snapshots_5m`. To (re)create
# a snapshot, load the table with COPY FROM once and run:
#   create snapshot hits_snapshots.<name> table hits
#     with (wait_for_completion = true)
[setup]
statement_files = ["../sql/hits_snapshot_repo.sql"]
statements = [
    '''
    restore snapshot hits_snapshots.snapshots_1m table hits
    with (wait_for_completion = true)
    ''',
    "refresh table hits"
]

# Q10: distinct count mixed with sum/count/avg over a low cardinality group by.
[[queries]]
name = "CH-Q10-group-by-regionid-mixed-aggregations"
statement = '''
    SELECT RegionID, SUM(AdvEngineID), COUNT(*) AS c, AVG(ResolutionWidth), COUNT(DISTINCT UserID)
    FROM hits
    GROUP BY RegionID
    ORDER BY c DESC
    LIMIT 10
'''
concurrency = 1
iterations = 20

# Q23: same shape, but a selective LIKE filter and a high cardinality group by.
[[queries]]
name = "CH-Q23-group-by-searchphrase-mixed-aggregations-filtered"
statement = '''
    SELECT SearchPhrase, MIN(URL), MIN(Title), COUNT(*) AS c, COUNT(DISTINCT UserID)
    FROM hits
    WHERE Title LIKE '%Google%' AND URL NOT LIKE '%.google.%' AND SearchPhrase <> ''
    GROUP BY SearchPhrase
    ORDER BY c DESC
    LIMIT 10
'''
concurrency = 1
iterations = 20

# [teardown]
# statements = ["drop table if exists hits"]
