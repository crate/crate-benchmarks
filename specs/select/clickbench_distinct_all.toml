# All ClickBench distinct-aggregation slow queries in a single spec, so the
# whole set can be run against one table load.
# Queries taken from https://benchmark.clickhouse.com (ClickBench Q5, Q6, Q9,
# Q10, Q11, Q12, Q14, Q23), licensed under Creative Commons, see
# https://github.com/ClickHouse/ClickBench/blob/main/LICENSE
#
# Restores the `hits` table from the `snapshots_1m` snapshot instead of
# re-importing the .tsv extract with COPY FROM. Much faster, but the table's
# schema, shard count and settings come from the snapshot, not from
# sql/hits.sql -- including the fact that it was loaded with
# `empty_string_as_null = false`, which the `<> ''` predicates of Q11, Q12,
# Q14 and Q23 depend on.
#
# sql/hits_snapshot_repo.sql only registers the repository -- it must not
# create the table, because RESTORE fails with RelationAlreadyExists if one of
# that name is already present. For the same reason a rerun against a
# long-running instance needs the table dropped first; with compare_run.py
# each version gets a fresh node, so nothing to do there.
#
# The repository also holds `hits` (3M rows) and `snapshots_5m`. To (re)create
# a snapshot, load the table with COPY FROM once and run:
#   create snapshot hits_snapshots.<name> table hits
#     with (wait_for_completion = true)
# [setup]
# statement_files = ["../sql/hits_snapshot_repo.sql"]
# statements = [
#     '''
#     restore snapshot hits_snapshots.snapshots_1m table hits
#     with (wait_for_completion = true)
#     ''',
#     "refresh table hits"
# ]

## Group 1: global aggregations

[[queries]]
name = "CH-Q5-count-distinct-userid"
statement = '''
    SELECT COUNT(DISTINCT UserID)
    FROM hits
'''
concurrency = 1
iterations = 100

[[queries]]
name = "CH-Q6-count-distinct-searchphrase"
statement = '''
    SELECT COUNT(DISTINCT SearchPhrase)
    FROM hits
'''
concurrency = 1
iterations = 100

## Group 2: group by a different column, order by the distinct aggregation

[[queries]]
name = "CH-Q9-group-by-regionid-order-by-count-distinct"
statement = '''
    SELECT RegionID, COUNT(DISTINCT UserID) AS u
    FROM hits
    GROUP BY RegionID
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

[[queries]]
name = "CH-Q9b-count-distinct-userid-group-by-regionid"
statement = '''
    SELECT RegionID, COUNT(DISTINCT UserID) AS u
    FROM hits
    GROUP BY RegionID
'''
concurrency = 1
iterations = 100

## Group 3: multiple aggregations, order by count(*), with and without filter

[[queries]]
name = "CH-Q10-group-by-regionid-mixed-aggregations"
statement = '''
    SELECT RegionID, SUM(AdvEngineID), COUNT(*) AS c, AVG(ResolutionWidth), COUNT(DISTINCT UserID)
    FROM hits
    GROUP BY RegionID
    ORDER BY c DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

[[queries]]
name = "CH-Q23-group-by-searchphrase-mixed-aggregations-filtered"
statement = '''
    SELECT SearchPhrase, MIN(URL), MIN(Title), COUNT(*) AS c, COUNT(DISTINCT UserID)
    FROM hits
    WHERE Title LIKE '%Google%' AND URL NOT LIKE '%.google.%' AND SearchPhrase <> ''
    GROUP BY SearchPhrase
    ORDER BY c DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

## Group 4: group by a different column, order by the distinct aggregation,
## with a filter

[[queries]]
name = "CH-Q11-group-by-mobilephonemodel-count-distinct"
statement = '''
    SELECT MobilePhoneModel, COUNT(DISTINCT UserID) AS u
    FROM hits
    WHERE MobilePhoneModel <> ''
    GROUP BY MobilePhoneModel
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

[[queries]]
name = "CH-Q12-group-by-mobilephone-model-count-distinct"
statement = '''
    SELECT MobilePhone, MobilePhoneModel, COUNT(DISTINCT UserID) AS u
    FROM hits
    WHERE MobilePhoneModel <> ''
    GROUP BY MobilePhone, MobilePhoneModel
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

[[queries]]
name = "CH-Q14-group-by-searchphrase-count-distinct"
statement = '''
    SELECT SearchPhrase, COUNT(DISTINCT UserID) AS u
    FROM hits
    WHERE SearchPhrase <> ''
    GROUP BY SearchPhrase
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 100

