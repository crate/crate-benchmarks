# ClickBench distinct-aggregation slow queries, group 4: group by a different
# column, order by the distinct aggregation, with a filter.
# Queries taken from https://benchmark.clickhouse.com (ClickBench Q11, Q14),
# licensed under Creative Commons, see
# https://github.com/ClickHouse/ClickBench/blob/main/LICENSE
#
# See clickbench_distinct_global.toml for notes on the COPY FROM options. All
# queries here filter on `<> ''` and therefore need
# `empty_string_as_null = false` to return rows.

[setup]
statement_files = ["../sql/hits.sql"]
statements = [
    '''
    COPY hits
    FROM 'file:///home/haris/projects/crate/clickhouse-hits-3M.tsv'
    WITH (
        "delimiter" = e'\t',
        "format" = 'csv',
        "header" = false,
        "empty_string_as_null" = false,
        "fail_fast" = true
    )
    ''',
    "refresh table hits"
]

# Q11: selective filter, low cardinality group by.
[[queries]]
name = "CH-Q11-group-by-mobilephonemodel-count-distinct"
statement = '''
    SELECT MobilePhoneModel, COUNT(DISTINCT UserID) AS u
    FROM hits
    WHERE MobilePhoneModel <> ''
    GROUP BY MobilePhoneModel
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 20

# Q14: barely selective filter, high cardinality group by.
[[queries]]
name = "CH-Q14-group-by-searchphrase-count-distinct"
statement = '''
    SELECT SearchPhrase, COUNT(DISTINCT UserID) AS u
    FROM hits
    WHERE SearchPhrase <> ''
    GROUP BY SearchPhrase
    ORDER BY u DESC
    LIMIT 10
'''
concurrency = 1
iterations = 20

