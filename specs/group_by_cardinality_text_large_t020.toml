[setup]
statements = [
  "create table t020 (x text) clustered into 5 shards",
  "insert into t020 (x) (select md5((x % 2000000)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t020",
  "optimize table t020",
  "analyze"
]

[[queries]]
name = "count_distinct_text_t020"
statement = "select count(distinct x) from t020"
concurrency = 1
iterations = 200
warmup = 50

