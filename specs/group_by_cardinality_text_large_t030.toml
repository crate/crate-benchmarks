[setup]
statements = [
  "create table t030 (x text) clustered into 5 shards",
  "insert into t030 (x) (select md5(floor(random() * 3127875)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t030",
  "optimize table t030",
  "analyze"
]

[[queries]]
name = "count_distinct_text_t030"
statement = "select count(distinct x) from t030"
concurrency = 1
iterations = 200
warmup = 50

