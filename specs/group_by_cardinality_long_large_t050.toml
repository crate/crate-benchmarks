[setup]
statements = [
  "create table t050 (x long) clustered into 5 shards",
  "insert into t050 (x) (select x % 5000000 from generate_series(1, 10000000) as t (x))",
  "refresh table t050",
  "optimize table t050",
  "analyze"
]

[[queries]]
name = "count_distinct_t050"
statement = "select count(distinct x) from t050"
concurrency = 1
iterations = 200
warmup = 50

[[queries]]
name = "select_x_count_star_t050"
statement = "SELECT x, count(*) FROM t050 GROUP BY x"
concurrency = 1
iterations = 200
warmup = 50

