[setup]
statements = [
  "create table t005 (x text) clustered into 5 shards",
  "insert into t005 (x) (select md5(floor(random() * 500000)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t005",
  "optimize table t005",
  "analyze"
]

[[queries]]
name = "count_distinct_text_t005"
statement = "select count(distinct x) from t005"
concurrency = 1
iterations = 200
warmup = 50

