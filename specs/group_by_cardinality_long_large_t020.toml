[setup]
statements = [
  "create table t020 (x long) clustered into 5 shards",
  "insert into t020 (x) (select x % 2000000 from generate_series(1, 10000000) as t (x))",
  "refresh table t020",
  "optimize table t020",
  "analyze"
]

[[queries]]
name = "count_distinct_t020"
statement = "select count(distinct x) from t020"
concurrency = 1
iterations = 200
warmup = 50

[[queries]]
name = "select_x_count_star_t020"
statement = "SELECT x, count(*) FROM t020 GROUP BY x"
concurrency = 1
iterations = 200
warmup = 50

