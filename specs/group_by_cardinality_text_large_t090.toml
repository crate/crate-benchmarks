[setup]
statements = [
  "create table t090 (x text) clustered into 5 shards",
  "insert into t090 (x) (select md5(floor(random() * 46607935)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t090",
  "optimize table t090",
  "analyze"
]

[[queries]]
name = "count_distinct_text_t090"
statement = "select count(distinct x) from t090"
concurrency = 1
iterations = 200
warmup = 50

