[setup]
statements = [
  "create table t0001 (x long) clustered into 5 shards",
  "insert into t0001 (x) (select x % 10000 from generate_series(1, 10000000) as t (x))",
  "refresh table t0001",
  "optimize table t0001",
  "analyze"
]

[[queries]]
name = "count_distinct_t0001"
statement = "select count(distinct x) from t0001"
concurrency = 1
iterations = 200
warmup = 50

[[queries]]
name = "select_x_count_star_t0001"
statement = "SELECT x, count(*) FROM t0001 GROUP BY x"
concurrency = 1
iterations = 200
warmup = 50

