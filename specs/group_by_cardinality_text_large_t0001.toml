[setup]
statements = [
  "create table t0001 (x text) clustered into 5 shards",
  "insert into t0001 (x) (select md5((x % 10000)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t0001",
  "optimize table t0001",
  "analyze"
]

[[queries]]
name = "count_distinct_text_t0001"
statement = "select count(distinct x) from t0001"
concurrency = 1
iterations = 200
warmup = 50

