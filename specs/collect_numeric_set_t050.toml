[setup]
statements = [
  "create table t050 (x long) clustered into 5 shards",
  "insert into t050 (x) (select x % 5000000 from generate_series(1, 10000000) as t (x))",
  "refresh table t050",
  "optimize table t050"
]

[[queries]]
name = "collect_numeric_set_t050"
statement = "SELECT collection_count(collect_numeric_set(x)) FROM t050"
concurrency = 1
iterations = 50
warmup = 3

[teardown]
statements = [
  "drop table if exists t050"
]
