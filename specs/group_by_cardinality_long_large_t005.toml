[setup]
statements = [
  "create table t005 (x long) clustered into 5 shards",
  "insert into t005 (x) (select x % 500000 from generate_series(1, 10000000) as t (x))",
  "refresh table t005",
  "optimize table t005",
  "analyze"
]


[[queries]]
name = "count_distinct_t005"
statement = "select count(distinct x) from t005"
concurrency = 1
iterations = 100
warmup = 3

[[queries]]
name = "select_x_count_star"
statement = "SELECT x, count(*) FROM t005 GROUP BY x"
concurrency = 1
iterations = 100
warmup = 3

[teardown]
statements = [
  "drop table if exists t005"
]
