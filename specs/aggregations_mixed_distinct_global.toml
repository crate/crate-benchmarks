'''
concurrency = 3
iterations = 150

[[queries]]
name = "Q-19a: non-distinct avg, distinct count, global, rewritten"
statement = '''
  SELECT SUM(partial_sum) / SUM(partial_cnt) AS avg_revenue, COUNT("cCode")
