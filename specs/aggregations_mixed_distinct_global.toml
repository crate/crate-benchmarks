    "refresh table uservisits"
]

[[queries]]
name = "Q-18: non-distinct sum, distinct count, global,"
statement = '''
    SELECT SUM("adRevenue"), COUNT(DISTINCT "cCode") 
    FROM uservisits;
'''
concurrency = 3
iterations = 150

[[queries]]
name = "Q-18a: non-distinct sum, distinct count, global, rewritten"
statement = '''
    SELECT SUM(partial_sum), COUNT("cCode")
    FROM (
        SELECT "cCode", SUM("adRevenue") AS partial_sum
        FROM uservisits
        GROUP BY "cCode"
    ) t;
'''
concurrency = 3
iterations = 150

[[queries]]
name = "Q-19: non-distinct avg, distinct count, global"
statement = '''
    SELECT AVG("adRevenue"), COUNT(DISTINCT "cCode") 
