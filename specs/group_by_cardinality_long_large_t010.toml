[setup]
statements = [
  "create table t010 (x long) clustered into 5 shards",
  "insert into t010 (x) (select x % 1000000 from generate_series(1, 10000000) as t (x))",
  "refresh table t010",
  "optimize table t010",
  "analyze"
]

[[queries]]
name = "count_distinct_t010"
statement = "select count(distinct x) from t010"
concurrency = 1
iterations = 200
warmup = 50

[[queries]]
name = "select_x_count_star_t010"
statement = "SELECT x, count(*) FROM t010 GROUP BY x"
concurrency = 1
iterations = 200
warmup = 50

