[setup]
statements = [
  "create table t005 (x text)",
  "insert into t005 (x) (select md5((x % 500000)::text) from generate_series(1, 10000000) as t (x))",
  "refresh table t005",
  "optimize table t005 with (max_num_segments = 1000)"
]

[[queries]]
name = "analyze-text-t005"
statement = '''analyze'''
concurrency = 1
warmup = 50
iterations = 300

[teardown]
statements = ["drop table if exists t005"]
